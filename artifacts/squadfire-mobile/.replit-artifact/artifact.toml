kind = "mobile"
previewPath = "/"
title = "SquadFire Mobile"
description = "A portrait mobile squad shooter vertical slice with a bright stylized battlefield, auto-fire combat, upgrade gates, a growing blue squad, incoming enemy waves, and a dramatic boss encounter."
version = "1.0.0"
id = "artifacts/squadfire-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22919

[services.development]
run = "pnpm --filter @workspace/squadfire-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/squadfire-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/squadfire-mobile", "run", "serve" ]

[services.env]
PORT = "22919"
BASE_PATH = "/"
